<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusssz — Enlaces</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

  :root{
    --bg: #0b0c10;
    --panel: #14161c;
    --panel-border: rgba(255,255,255,0.06);
    --ink: #f2f1ef;
    --ink-dim: rgba(242,241,239,0.65);
    --chip: rgba(255,255,255,0.06);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    overflow-x:hidden;
  }

  .glow{
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  .glow.red{
    width: 420px; height: 420px;
    background: rgba(180,40,40,0.35);
    top: -80px; left: -140px;
  }
  .glow.green{
    width: 380px; height: 380px;
    background: rgba(40,160,90,0.28);
    bottom: -100px; right: -120px;
  }

  .stage{
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 64px 20px 60px;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    padding: 32px 24px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }

  /* ---------- VIEW SWITCHER ---------- */
  .view{ display:none; }
  .view.active{ display:block; }

  @keyframes slideIn{
    from{ opacity:0; transform: translateX(14px); }
    to{ opacity:1; transform: translateX(0); }
  }
  .view.active{ animation: slideIn 0.25s ease; }
  @media (prefers-reduced-motion: reduce){
    .view.active{ animation:none; }
  }

  /* ---------- MAIN VIEW ---------- */
  .avatar{
    width: 84px;
    height: 84px;
    border-radius: 50%;
    margin: 0 auto 14px;
    display:block;
    overflow:hidden;
    border: 1px solid var(--panel-border);
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  h1{
    text-align:center;
    font-size: 24px;
    font-weight: 800;
    margin: 0 0 16px;
  }

  .socials{
    display:flex;
    justify-content:center;
    gap: 10px;
    margin-bottom: 26px;
  }
  .socials a{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--chip);
    display:flex; align-items:center; justify-content:center;
    color: var(--ink);
    text-decoration:none;
  }
  .socials a svg{ width:17px; height:17px; fill: currentColor; }

  .links{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    text-decoration:none;
    color: #fff;
    border:none;
    cursor:pointer;
    font-family: inherit;
    text-align:left;
    width:100%;
  }

  .link-row .icon{
    width: 38px; height:38px;
    border-radius: 12px;
    background: rgba(255,255,255,0.18);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .link-row .icon svg{ width:19px; height:19px; fill:#fff; }

  .link-row .text{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .link-row .title{ font-weight:700; font-size:15px; }
  .link-row .sub{ font-size:12.5px; color: rgba(255,255,255,0.82); }

  .youtube{ background: linear-gradient(135deg,#e34141,#c62828); }
  .kick{ background: linear-gradient(135deg,#53d769,#1fa851); }
  .twitch{ background: linear-gradient(135deg,#9146ff,#6421c9); }
  .tiktok{ background: linear-gradient(135deg,#2f2f33,#111113); }
  .instagram{ background: linear-gradient(135deg,#d1418f,#a52a71); }
  .x{ background: linear-gradient(135deg,#3a3f47,#20242a); }
  .contact{ background: rgba(255,255,255,0.05); cursor:default; }
  .contact .title, .contact .sub{ color: var(--ink-dim); }
  .contact .icon{ background: rgba(255,255,255,0.08); }
  .contact .icon svg{ fill: var(--ink-dim); }

  /* ---------- YOUTUBE SUBVIEW ---------- */
  .sub-title{
    text-align:center;
    font-size: 19px;
    font-weight: 800;
    margin: 4px 0 4px;
  }
  .sub-desc{
    text-align:center;
    font-size: 13px;
    color: var(--ink-dim);
    margin: 0 0 20px;
  }

  .channel-row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-left: 3px solid #c62828;
    text-decoration:none;
    color: var(--ink);
    margin-bottom: 10px;
  }
  .channel-row img{
    width: 38px; height:38px;
    border-radius: 50%;
    object-fit:cover;
    flex-shrink:0;
  }
  .channel-row .text{ flex:1; min-width:0; }
  .channel-row .title{ font-weight:700; font-size:14.5px; }
  .channel-row .sub{ font-size:12px; color: var(--ink-dim); }
  .channel-row .chev{ color: var(--ink-dim); font-size:16px; }

  .back-btn{
    display:block;
    margin: 18px auto 0;
    background:none;
    border:none;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 13px;
    cursor:pointer;
    padding: 6px;
  }
  .back-btn:hover{ color: var(--ink); }
</style>
</head>
<body>

<div class="glow red"></div>
<div class="glow green"></div>

<div class="stage">
  <div class="card">

    <!-- ================= MAIN VIEW ================= -->
    <div class="view active" id="view-main">

      <div class="avatar">
        <img src="avatar-main.png" alt="Avatar de Fusssz">
      </div>
      <h1>Fusssz</h1>

      <div class="socials">
        <a href="https://www.tiktok.com/@fusssz_" target="_blank" rel="noopener" aria-label="TikTok">
          <svg viewBox="0 0 24 24"><path d="M16.6 5.82c-1-.9-1.6-2.2-1.6-3.6h-3.2v13.9c0 1.6-1.3 2.9-2.9 2.9s-2.9-1.3-2.9-2.9 1.3-2.9 2.9-2.9c.3 0 .6.05.9.14V10c-.3-.04-.6-.06-.9-.06-3.4 0-6.1 2.7-6.1 6.1S6.4 22.15 9.8 22.15s6.1-2.7 6.1-6.1V9.03c1.3.9 2.9 1.4 4.5 1.4V7.2c-1.3 0-2.6-.5-3.8-1.38z"/></svg>
        </a>
        <a href="https://x.com/Fusssz_" target="_blank" rel="noopener" aria-label="X">
          <svg viewBox="0 0 24 24"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-6.9l-5.4-6.9L4.8 22H1.7l8.1-9.3L1 2h7l4.9 6.3L18.9 2zm-1.2 18h1.9L7.4 4h-2l12.3 16z"/></svg>
        </a>
      </div>

      <div class="links">
        <button type="button" class="link-row youtube" onclick="showView('view-youtube')">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M23 12s0-3.5-.45-5.2a2.9 2.9 0 0 0-2-2C18.9 4.3 12 4.3 12 4.3s-6.9 0-8.55.5a2.9 2.9 0 0 0-2 2C1 8.5 1 12 1 12s0 3.5.45 5.2a2.9 2.9 0 0 0 2 2c1.65.5 8.55.5 8.55.5s6.9 0 8.55-.5a2.9 2.9 0 0 0 2-2C23 15.5 23 12 23 12zM9.7 15.4V8.6l6 3.4-6 3.4z"/></svg></span>
          <span class="text">
            <span class="title">YouTube</span>
            <span class="sub">canales oficiales</span>
          </span>
        </button>

        <a class="link-row kick" href="https://kick.com/fusssz" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 3h5v5.2L12.8 3H19l-7.5 7.5L19.3 21H13l-5-6.3V21H3V3z"/></svg></span>
          <span class="text">
            <span class="title">Kick</span>
            <span class="sub">directos en vivo</span>
          </span>
        </a>

        <a class="link-row twitch" href="https://www.twitch.tv/fusssz" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 2 2.5 5.5v14H7V22l3-2.5h4L20 14V2H4zm14 11-3 2.5h-4l-2.5 2v-2H5V4h13v9z"/><path d="M15.5 6.5h2V12h-2zM10.5 6.5h2V12h-2z"/></svg></span>
          <span class="text">
            <span class="title">Twitch</span>
            <span class="sub">directos en vivo</span>
          </span>
        </a>

        <a class="link-row instagram" href="https://www.instagram.com/fusssz_/" target="_blank" rel="noopener">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.07 1.2.05 1.9.23 2.4.38.6.24 1 .52 1.5 1 .48.48.76.9 1 1.5.15.5.33 1.2.38 2.4.06 1.2.07 1.6.07 4.8s0 3.6-.07 4.8c-.05 1.2-.23 1.9-.38 2.4-.24.6-.52 1-1 1.5-.48.48-.9.76-1.5 1-.5.15-1.2.33-2.4.38-1.2.06-1.6.07-4.8.07s-3.6 0-4.8-.07c-1.2-.05-1.9-.23-2.4-.38-.6-.24-1-.52-1.5-1-.48-.48-.76-.9-1-1.5-.15-.5-.33-1.2-.34-2.4C2.21 15.6 2.2 15.2 2.2 12s0-3.6.07-4.8c.05-1.2.23-1.9.38-2.4.24-.6.52-1 1-1.5.48-.48.9-.76 1.5-1 .5-.15 1.2-.33 2.4-.38C8.4 2.21 8.8 2.2 12 2.2zm0 1.8c-3.14 0-3.5 0-4.74.07-1 .04-1.5.2-1.86.34-.47.18-.8.4-1.15.75-.35.35-.57.68-.75 1.15-.14.36-.3.86-.34 1.86C3.1 8.5 3.1 8.86 3.1 12s0 3.5.07 4.74c.04 1 .2 1.5.34 1.86.18.47.4.8.75 1.15.35.35.68.57 1.15.75.36.14.86.3 1.86.34 1.24.06 1.6.07 4.74.07s3.5 0 4.74-.07c1-.04 1.5-.2 1.86-.34.47-.18.8-.4 1.15-.75.35-.35.57-.68.75-1.15.14-.36.3-.86.34-1.86.06-1.24.07-1.6.07-4.74s0-3.5-.07-4.74c-.04-1-.2-1.5-.34-1.86-.18-.47-.4-.8-.75-1.15-.35-.35-.68-.57-1.15-.75-.36-.14-.86-.3-1.86-.34C15.5 4 15.14 4 12 4zm0 3.4a4.6 4.6 0 1 1 0 9.2 4.6 4.6 0 0 1 0-9.2zm0 1.8a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zm5.9-2a1.08 1.08 0 1 1-2.15 0 1.08 1.08 0 0 1 2.15 0z"/></svg></span>
          <span class="text">
            <span class="title">Instagram</span>
            <span class="sub">detrás de cámara</span>
          </span>
        </a>

        <div class="link-row contact">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M2 4h20v16H2V4zm2 2v.01L12 12l8-5.99V6H4zm16 2.24-8 6-8-6V18h16V8.24z"/></svg></span>
          <span class="text">
            <span class="title">Contacto</span>
            <span class="sub">próximamente</span>
          </span>
        </div>
      </div>

    </div>

    <!-- ================= YOUTUBE SUBVIEW ================= -->
    <div class="view" id="view-youtube">
      <p class="sub-title">Mis canales de YouTube</p>
      <p class="sub-desc">Elige el canal que quieres visitar</p>

      <a class="channel-row" href="https://youtube.com/@fusssz_" target="_blank" rel="noopener">
        <img src="avatar-channel-main.png" alt="">
        <span class="text">
          <span class="title">Canal principal · Fusssz</span>
          <span class="sub">gaming variado y contenido editado</span>
        </span>
        <span class="chev">›</span>
      </a>

      <a class="channel-row" href="https://www.youtube.com/@FussszR" target="_blank" rel="noopener">
        <img src="avatar-channel-reactions.png" alt="">
        <span class="text">
          <span class="title">Canal secundario · FussszR</span>
          <span class="sub">reacciones</span>
        </span>
        <span class="chev">›</span>
      </a>

      <!-- Cuando tengas más canales, duplica un bloque .channel-row de arriba
           y cambia el link, la imagen y el texto -->

      <button type="button" class="back-btn" onclick="showView('view-main')">Volver atrás</button>
    </div>

  </div>
</div>

<script>
  function showView(id){
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
